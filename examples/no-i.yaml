schema_version: 1
name: paired-no-i-tutorial
seed: 50
dataset:
  adapter: synthetic
  reference_column: photoz_best
  kwargs: {n_objects: 160, n_grid: 40}
features:
  extra_columns: []
splits:
  split_path: ../runs/synthetic/splits.npz
training:
  params_path: ../runs/synthetic/zml/best_params.json
  hpo: {mode: reuse_parameters}
  verbose: 0
sigmaml:
  params_path: ../runs/synthetic/sigmaml/best_params.json
  hpo: {mode: reuse_parameters}
  calibration: {n_bins: 4, smooth_bw_dex: 0.2}
bootstrap:
  resamples: 50
  confidence_level: 0.95
applicability:
  mag_bounds: [19, 25]
  n_neighbors: 5
