[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turbopdz"
version = "0.1.0"
description = "PDZ-derived photometric-redshift point estimates and empirical reliability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rodrigo Duarte"}, {name = "Valerio Marra"}]
dependencies = ["numpy>=1.24,<2", "scipy>=1.10,<2", "pandas>=2,<3", "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
train = ["tensorflow>=2.19,<2.20", "optuna>=4,<5"]
inference = ["tensorflow>=2.19,<2.20"]
notebooks = ["jupyterlab>=4,<5", "papermill>=2.6,<3", "matplotlib>=3.8,<4"]
hsc = ["astropy>=6,<8", "pyarrow>=15"]
test = ["pytest>=8,<9", "nbformat>=5", "build>=1"]

[project.scripts]
turbopdz = "turbopdz.cli:main"

[project.urls]
Repository = "https://github.com/valerio-marra/turboPDZ"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["training: requires the optional TensorFlow training dependencies"]
